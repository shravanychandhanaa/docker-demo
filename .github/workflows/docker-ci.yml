name: CI Build, Push and Run

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/docker-basics-demo:${{ github.sha }}

      - name: Run container and verify (exec inside container)
        run: |
          docker run -d --name demo-container -p 8080:3000 ${{ secrets.DOCKERHUB_USERNAME }}/docker-basics-demo:${{ github.sha }}
          sleep 2
          echo "Response from inside container:"
          # Use docker exec to run curl inside the container. The base image is Alpine, so install curl if missing.
          docker exec demo-container sh -c "apk add --no-cache curl >/dev/null 2>&1 || true; curl --retry 5 --retry-delay 1 http://localhost:3000" || true

      - name: Stop container (cleanup)
        if: always()
        run: |
          docker stop demo-container || true
          docker rm demo-container || true
