name: CI Build, Push and Verify Docker Image

on:
  push:
    branches:
      - main
      - master

jobs:
  build-push-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-basics-demo:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-basics-demo:${{ github.sha }}

      - name: Run container and verify
        run: |
          docker run -d --name demo-container -p 8080:3000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/docker-basics-demo:latest

          sleep 5

          echo "================ CONTAINER LOGS ================"
          docker logs demo-container

          echo "================ HTTP RESPONSE ================="
          curl -v --retry 5 --retry-delay 2 http://localhost:8080 || true

      - name: Cleanup container
        if: always()
        run: |
          docker stop demo-container || true
          docker rm demo-container || true
